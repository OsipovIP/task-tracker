{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block unauthenticated_content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Авторизация</h4>
                </div>
                <div class="card-body">
                    {% if form.errors %}
                        <p class="text-danger">Неверный логин или пароль. Попробуйте снова.</p>
                    {% endif %}
                    
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя:</label>
                            {{ form.username }}
                        </div>
                        
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Пароль:</label>
                            {{ form.password }}
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock unauthenticated_content %}
